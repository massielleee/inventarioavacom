{% extends "base.html" %}
{% block title %}Nueva capacitación{% endblock %}
{% block body %}
<div class="topbar">
  <div class="tb-back">
    <a href="{{ url_for('capacitaciones') }}" class="back-btn" title="Volver" aria-label="Volver">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div><div class="crumb"><a href="{{ url_for('capacitaciones') }}">Capacitaciones</a> / Nueva</div><h1>Programar capacitación</h1></div>
  </div>
</div>

<form method="post">
<div class="form-2col">
  <div class="card">
    <div class="form-section-head">
      <span class="fs-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5"/></svg></span>
      <div><h2 style="margin:0">Datos de la capacitación</h2><p class="fs-sub">Tema y responsable</p></div>
    </div>
    <div class="field"><label>Título / Tema <span class="req">*</span></label>
      <select name="titulo_sel" id="tituloSel" onchange="toggleOtroTitulo()">
        <option value="Uso del tablero inteligente AVACOM en aula">Uso del tablero inteligente AVACOM en aula</option>
        <option value="Uso de la tablet educativa AVACOM">Uso de la tablet educativa AVACOM</option>
        <option value="Uso de la mesa interactiva AVACOM">Uso de la mesa interactiva AVACOM</option>
        <option value="Mantenimiento y cuidado de los equipos">Mantenimiento y cuidado de los equipos</option>
        <option value="Inducción al ecosistema educativo AVACOM">Inducción al ecosistema educativo AVACOM</option>
        <option value="__otro__">Otro (escribir)…</option>
      </select>
      <input name="titulo_otro" id="tituloOtro" placeholder="Escribe el tema" style="display:none;margin-top:8px">
    </div>
    <div class="field"><label>Descripción</label>
      <textarea name="descripcion" placeholder="Objetivo y contenido de la capacitación…"></textarea></div>
    <div class="field"><label>Capacitador</label>
      <input name="capacitador" value="{{ session.nombre }}" placeholder="Nombre de quien capacita"></div>
  </div>

  <div class="card">
    <div class="form-section-head">
      <span class="fs-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
      <div><h2 style="margin:0">Logística</h2><p class="fs-sub">Cuándo, dónde y cuántos</p></div>
    </div>
    <div class="field"><label>Modalidad <span class="req">*</span></label>
      <div class="radio-cards">
        <label class="radio-card">
          <input type="radio" name="modalidad" value="PRESENCIAL" checked>
          <span class="rc-body">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <b>Presencial</b><small>En sitio</small>
          </span>
        </label>
        <label class="radio-card">
          <input type="radio" name="modalidad" value="VIRTUAL">
          <span class="rc-body">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <b>Virtual</b><small>Remota</small>
          </span>
        </label>
      </div>
    </div>
    <div class="field"><label>Lugar / Enlace de la reunión</label>
      <input name="lugar" placeholder="Ej. Auditorio sede Norte / enlace Meet"></div>
    <div class="form-grid">
      <div class="field"><label>Fecha</label><input name="fecha" type="date"></div>
      <div class="field"><label>Hora</label><input name="hora" type="time"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>Duración estimada</label>
        <select name="duracion_est">
          <option value="">— Selecciona —</option>
          <option>30 minutos</option>
          <option>1 hora</option>
          <option>1 hora y media</option>
          <option selected>2 horas</option>
          <option>3 horas</option>
          <option>Media jornada (4 horas)</option>
          <option>Jornada completa (8 horas)</option>
        </select></div>
      <div class="field"><label>Nº de asistentes esperados</label><input name="num_esperados" type="number" min="0" placeholder="Ej. 200"></div>
    </div>
  </div>
</div>

<div class="form-actions-bar">
  <a href="{{ url_for('capacitaciones') }}" class="btn btn-ghost">Cancelar</a>
  <button class="btn" type="submit">Crear y generar link →</button>
</div>
</form>
<script>
// Si eligen "Otro" en el tema, mostrar el campo para escribirlo.
function toggleOtroTitulo(){
  var sel = document.getElementById('tituloSel');
  var otro = document.getElementById('tituloOtro');
  if (sel.value === '__otro__'){ otro.style.display='block'; otro.required=true; otro.focus(); }
  else { otro.style.display='none'; otro.required=false; otro.value=''; }
}
</script>
{% endblock %}
