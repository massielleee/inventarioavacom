{% extends "base.html" %}
{% block title %}Nueva garantía{% endblock %}
{% block body %}
<div class="topbar">
  <div class="tb-back">
    <a href="{{ url_for('garantias') }}" class="back-btn" title="Volver" aria-label="Volver">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div><div class="crumb"><a href="{{ url_for('garantias') }}">Garantías</a> / Nueva</div><h1>Registrar garantía</h1></div>
  </div>
</div>

<form method="post" id="garform">
<div class="form-2col">
  <!-- Datos del reporte -->
  <div class="card">
    <div class="form-section-head">
      <span class="fs-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a3.5 3.5 0 0 0-4.7 4.3L3.4 17.2a1.8 1.8 0 0 0 2.5 2.5l6.6-6.6a3.5 3.5 0 0 0 4.3-4.7l-2.2 2.2-2.3-.5-.5-2.3z"/></svg></span>
      <div><h2 style="margin:0">Datos del reporte</h2><p class="fs-sub">¿Qué equipo falla y qué le pasó?</p></div>
    </div>
    <div class="field"><label>Producto en garantía</label>
      <select name="producto" required>
        {% for p in productos %}<option value="{{ p.id }}">{{ p.sku }} — {{ p.nombre }}</option>{% endfor %}
      </select></div>
    <div class="field"><label>Descripción de la falla <span class="req">*</span></label>
      <textarea name="descripcion" placeholder="Ej. La pantalla táctil no responde en la esquina inferior…" required></textarea></div>
    <div class="field"><label>¿Por qué se dañó? (causa reportada)</label>
      <input name="motivo_dano" placeholder="Ej. Caída accidental / falla de fábrica / sobretensión"></div>
  </div>

  <!-- Quién reporta + soporte -->
  <div class="card">
    <div class="form-section-head">
      <span class="fs-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.2a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg></span>
      <div><h2 style="margin:0">Quién reporta</h2><p class="fs-sub">Contacto y tipo de atención</p></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>Cliente</label><input name="cliente" required placeholder="Ej. Colegio San José"></div>
      <div class="field"><label>Teléfono</label><input name="telefono" placeholder="Opcional"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>¿Quién llamó?</label><input name="quien_llamo" placeholder="Nombre de quien reporta"></div>
      <div class="field"><label>¿De dónde llamó?</label><input name="origen_llamada" placeholder="Sede / ciudad"></div>
    </div>
    <div class="field"><label>Tipo de soporte <span class="req">*</span></label>
      <div class="radio-cards">
        <label class="radio-card">
          <input type="radio" name="tipo_soporte" value="PRESENCIAL" checked>
          <span class="rc-body">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <b>Visita presencial</b><small>El técnico va al sitio</small>
          </span>
        </label>
        <label class="radio-card">
          <input type="radio" name="tipo_soporte" value="VIRTUAL">
          <span class="rc-body">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <b>Soporte virtual</b><small>Atención remota</small>
          </span>
        </label>
      </div>
    </div>
  </div>
</div>

<div class="form-actions-bar">
  <a href="{{ url_for('garantias') }}" class="btn btn-ghost">Cancelar</a>
  <button class="btn" type="submit">Registrar y gestionar →</button>
</div>
</form>
{% endblock %}
