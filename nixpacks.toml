# Config de despliegue para Railway (Nixpacks).
# Fija Python 3.12 sin exigir una versión exacta, para evitar
# el error "No GitHub artifact attestations found".
[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
